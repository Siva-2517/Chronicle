services:
  # ──────────────────────────────────────────────
  # 1. Node.js Backend API + WebSocket
  # ──────────────────────────────────────────────
  - type: web
    name: chronicle-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # Set in Render Dashboard
      - key: GITHUB_TOKEN
        sync: false          # Set in Render Dashboard
      - key: AGENT_SERVICE_URL
        sync: false          # Set AFTER agent-service is deployed (its .onrender.com URL)

  # ──────────────────────────────────────────────
  # 2. Python FastAPI Agent Service (LangGraph AI)
  # ──────────────────────────────────────────────
  - type: web
    name: chronicle-agent-service
    runtime: python
    rootDir: agent-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false          # Set in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false          # Set in Render Dashboard
      - key: GEMINI_API_KEY_SECONDARY
        sync: false          # Set in Render Dashboard
      - key: PINECONE_API_KEY
        sync: false          # Set in Render Dashboard (from app.pinecone.io)
      - key: PINECONE_INDEX_NAME
        value: chronicle
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
